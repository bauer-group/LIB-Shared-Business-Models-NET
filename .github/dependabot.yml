# =============================================================================
# Dependabot Configuration
# =============================================================================
# Weekly automatic dependency updates for NuGet packages and GitHub Actions.
# Commit prefixes follow the BG commit standards (deps(dotnet), chore(ci)).
# =============================================================================

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "17:05"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(dotnet)"
    labels:
      - "dependencies"
      - "nuget"
    ignore:
      # BAUERGROUP.* sister packages float to the current major (e.g. 3.*) in
      # Directory.Packages.props — restore always pulls the latest. Don't let
      # Dependabot churn them with floor bumps.
      - dependency-name: "BAUERGROUP.*"
      # FluentAssertions >= 8.0 switched to a commercial (Xceed) license.
      # 7.2.x is the last Apache-2.0 line; stay on it deliberately.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      analyzers:
        patterns:
          - "Roslynator.*"
          - "PolySharp"
          - "NetArchTest.*"
      testing:
        patterns:
          - "xunit*"
          - "FluentAssertions*"
          - "coverlet*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "17:05"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
